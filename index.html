
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>点検アプリ（全ポンプ場対応）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: sans-serif; padding: 1em; }
    input, select, textarea { width: 100%; margin: 4px 0; }
    button { margin-top: 10px; width: 100%; padding: 10px; }
    .entry { border: 1px solid #ccc; padding: 8px; margin: 10px 0; }
  </style>
</head>
<body>

  <h2>点検フォーム</h2>
  <form id="form">
    <label>ポンプ場:</label>
    <select name="plant" id="plant-select" required>
      <option value="">選択してください</option>
      <option value="歌長">歌長</option>
<option value="湯">湯</option>
<option value="細田">細田</option>
<option value="竹田">竹田</option>
<option value="井土">井土</option>
<option value="今岡金屋">今岡金屋</option>
<option value="千原">千原</option>
<option value="鐘尾">鐘尾</option>
<option value="千谷">千谷</option>
    </select>

    <label>号数:</label>
    <input type="text" name="number" required>

    <h3>No.1ポンプ</h3>
    電流値: <input type="text" name="amp1">
    積算計: <input type="text" name="total1">
    絶縁抵抗: <input type="text" name="res1">
    備考: <input type="text" name="note1">

    <h3>No.2ポンプ</h3>
    電流値: <input type="text" name="amp2">
    積算計: <input type="text" name="total2">
    絶縁抵抗: <input type="text" name="res2">
    備考: <input type="text" name="note2">

    <button type="submit">保存</button>
  </form>

  <h2>保存履歴</h2>
  <div id="history"></div>

  <script>
    const form = document.getElementById('form');
    const historyDiv = document.getElementById('history');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form));
      data.timestamp = new Date().toLocaleString();
      const saved = JSON.parse(localStorage.getItem('pumpData') || '[]');
      saved.unshift(data);
      localStorage.setItem('pumpData', JSON.stringify(saved));
      alert("保存しました！");
      form.reset();
      showHistory();
    });

    function showHistory() {
      const saved = JSON.parse(localStorage.getItem('pumpData') || '[]');
      historyDiv.innerHTML = '';
      saved.forEach((entry, i) => {
        const div = document.createElement('div');
        div.className = 'entry';
        div.innerHTML = `
          <strong>${entry.timestamp}</strong><br>
          ポンプ場: ${entry.plant}<br>
          号数: ${entry.number}<br>
          No.1: 電流=${entry.amp1}, 積算=${entry.total1}, 抵抗=${entry.res1}, 備考=${entry.note1}<br>
          No.2: 電流=${entry.amp2}, 積算=${entry.total2}, 抵抗=${entry.res2}, 備考=${entry.note2}<br>
          <button onclick="deleteEntry(${i})">削除</button>
        `;
        historyDiv.appendChild(div);
      });
    }

    function deleteEntry(index) {
      const saved = JSON.parse(localStorage.getItem('pumpData') || '[]');
      saved.splice(index, 1);
      localStorage.setItem('pumpData', JSON.stringify(saved));
      showHistory();
    }

    showHistory();
  </script>
</body>
</html>
